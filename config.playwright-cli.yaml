#ddev-generated
hooks:
  post-start:
    # Add @playwright/cli to package.json if it isn't already declared.
    - exec: "grep -q '\"@playwright/cli\"' /var/www/html/package.json || npm install --save-dev @playwright/cli"
    # Install dependencies from the lockfile if the binary isn't present yet.
    - exec: "[ -x /var/www/html/node_modules/.bin/playwright-cli ] || npm ci"
    # Install chromium and playwright-cli skills.
    - exec: "playwright-cli install-browser chromium"
    - exec: "[[ -d /var/www/html/.claude/skills/playwright-cli ]] || playwright-cli install --skills"
    # Configure the cert store for DDEV/mkcert from the host.
    - exec: mkdir -p $HOME/.pki/nssdb && certutil -d sql:$HOME/.pki/nssdb -N --empty-password && certutil -d sql:$HOME/.pki/nssdb -A -t "C,," -n mkcert-ca -i $(mkcert -CAROOT)/rootCA.pem
web_environment:
  - PLAYWRIGHT_BROWSERS_PATH=/mnt/ddev-global-cache/playwright-browsers
  # The browser cache is shared across every DDEV project, but Playwright's
  # garbage collection assumes it owns the directory and deletes revisions it
  # doesn't recognise. Left on, an install here removes the browsers other
  # projects pinned to a different playwright-core, forcing them to re-download.
  - PLAYWRIGHT_SKIP_BROWSER_GC=1
  - PLAYWRIGHT_MCP_BROWSER=chromium
